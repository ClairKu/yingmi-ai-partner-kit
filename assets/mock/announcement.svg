    <text x="46" y="207" font-size="11" font-weight="400" fill="#6D7A8F" text-anchor="start">从明确问题出发，按专业流程组织交付</text>
    <rect x="46" y="227" width="276" height="105" rx="14" fill="#EFF4FF"/>
    <text x="62" y="253" font-size="14" font-weight="400" fill="#162B44" text-anchor="start">从一份模拟基金公告提取业务字段。</text><text x="62" y="277" font-size="14" font-weight="400" fill="#162B44" text-anchor="start">输出对应原文与待核实项，</text><text x="62" y="301" font-size="14" font-weight="400" fill="#162B44" text-anchor="start">不把模型推断直接当作正式参数。</text>
    <text x="46" y="371" font-size="12" font-weight="600" fill="#6D7A8F" text-anchor="start">处理路径</text>
    <line x1="57" y1="417" x2="57" y2="447" stroke="#DCE5F8" stroke-width="2"/><circle cx="57" cy="405" r="11" fill="#EEF3FF"/><path d="M53,405 l3,3 l6,-6" fill="none" stroke="#2458F5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="77" y="409" font-size="14" font-weight="600" fill="#162B44" text-anchor="start">读取公告文本</text><text x="77" y="428" font-size="11" font-weight="400" fill="#6D7A8F" text-anchor="start">保留来源与原文结构</text><line x1="57" y1="470" x2="57" y2="500" stroke="#DCE5F8" stroke-width="2"/><circle cx="57" cy="458" r="11" fill="#EEF3FF"/><path d="M53,458 l3,3 l6,-6" fill="none" stroke="#2458F5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="77" y="462" font-size="14" font-weight="600" fill="#162B44" text-anchor="start">组织结构化字段</text><text x="77" y="481" font-size="11" font-weight="400" fill="#6D7A8F" text-anchor="start">提取对象、时间与业务条件</text><line x1="57" y1="523" x2="57" y2="553" stroke="#DCE5F8" stroke-width="2"/><circle cx="57" cy="511" r="11" fill="#EEF3FF"/><path d="M53,511 l3,3 l6,-6" fill="none" stroke="#2458F5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="77" y="515" font-size="14" font-weight="600" fill="#162B44" text-anchor="start">执行规则校验</text><text x="77" y="534" font-size="11" font-weight="400" fill="#6D7A8F" text-anchor="start">检查缺失、冲突与异常</text><circle cx="57" cy="564" r="11" fill="#EEF3FF"/><path d="M53,564 l3,3 l6,-6" fill="none" stroke="#2458F5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="77" y="568" font-size="14" font-weight="600" fill="#162B44" text-anchor="start">交给人工复核</text><text x="77" y="587" font-size="11" font-weight="400" fill="#6D7A8F" text-anchor="start">核对后再进入业务流程</text><rect x="46" y="644" width="276" height="48" rx="11" fill="#F8FAFD" stroke="#E2E8F0"/><text x="60" y="664" font-size="12" font-weight="400" fill="#6D7A8F" text-anchor="start">示例输入已匿名化</text><text x="60" y="682" font-size="11" font-weight="400" fill="#6D7A8F" text-anchor="start">模拟分析 · 不触发真实交易</text><rect x="366" y="148" width="888" height="72" rx="16" fill="white" stroke="#E2E8F0"/><text x="388" y="179" font-size="22" font-weight="650" fill="#162B44" text-anchor="start">让公告参数提取，有原文可回看</text><text x="388" y="203" font-size="12" font-weight="400" fill="#6D7A8F" text-anchor="start">公告输入 → 字段提取 → 规则校验 → 人工复核</text><rect x="366" y="236" width="888" height="81" rx="16" fill="white" stroke="#E2E8F0"/><text x="386" y="266" font-size="17" font-weight="600" fill="#162B44" text-anchor="start">公告处理｜模拟基金公告样本</text><text x="386" y="288" font-size="12" font-weight="400" fill="#6D7A8F" text-anchor="start">原文、字段、校验结果均为概念示意，不对应真实公告</text><rect x="1088" y="263" width="144" height="28" rx="14" fill="#FFF4E4"/><text x="1160.0" y="282" font-size="13" font-weight="500" fill="#AD7C2C" text-anchor="middle">待人工复核</text><rect x="366" y="333" width="366" height="360" rx="16" fill="white" stroke="#E2E8F0"/><text x="386" y="363" font-size="17" font-weight="600" fill="#162B44" text-anchor="start">公告原文摘录（示意）</text><text x="386" y="385" font-size="12" font-weight="400" fill="#6D7A8F" text-anchor="start">保留文本位置，便于核对</text><rect x="386" y="398" width="326" height="246" rx="12" fill="#F8FAFD"/><text x="403" y="433" font-size="17" font-weight="600" fill="#162B44" text-anchor="start">关于调整业务办理安排的公告</text><text x="403" y="474" font-size="14" font-weight="400" fill="#6D7A8F" text-anchor="start">示意基金产品 A</text><text x="403" y="505" font-size="14" font-weight="400" fill="#6D7A8F" text-anchor="start">涉及事项：业务安排变更</text><text x="403" y="536" font-size="14" font-weight="400" fill="#6D7A8F" text-anchor="start">适用日期：示意日期</text><text x="403" y="567" font-size="14" font-weight="400" fill="#6D7A8F" text-anchor="start">需提取：事项、对象、时间、条件</text><text x="403" y="598" font-size="14" font-weight="400" fill="#6D7A8F" text-anchor="start">注：此处所有内容均为模拟。</text><rect x="748" y="333" width="506" height="360" rx="16" fill="white" stroke="#E2E8F0"/><text x="768" y="363" font-size="17" font-weight="600" fill="#162B44" text-anchor="start">结构化字段与校验</text><text x="768" y="385" font-size="12" font-weight="400" fill="#6D7A8F" text-anchor="start">把非结构化文本转成可核对的数据记录</text><rect x="768" y="400" width="466" height="43" rx="8" fill="#F4F6FB"/><text x="782" y="427" font-size="12" font-weight="600" fill="#6D7A8F" text-anchor="start">字段</text><text x="920" y="427" font-size="12" font-weight="600" fill="#6D7A8F" text-anchor="start">提取内容</text><text x="1112" y="427" font-size="12" font-weight="600" fill="#6D7A8F" text-anchor="start">校验状态</text><text x="782" y="470" font-size="13" font-weight="500" fill="#162B44" text-anchor="start">公告类型</text><text x="920" y="470" font-size="13" font-weight="400" fill="#162B44" text-anchor="start">业务安排变更</text><text x="1112" y="470" font-size="13" font-weight="400" fill="#2458F5" text-anchor="start">待核对</text><line x1="768" y1="486" x2="1234" y2="486" stroke="#E2E8F0" stroke-width="1"/><rect x="768" y="486" width="466" height="43" rx="0" fill="#FAFBFD"/><text x="782" y="513" font-size="13" font-weight="500" fill="#162B44" text-anchor="start">适用对象</text><text x="920" y="513" font-size="13" font-weight="400" fill="#162B44" text-anchor="start">示意基金 A</text><text x="1112" y="513" font-size="13" font-weight="400" fill="#2458F5" text-anchor="start">待核对</text><line x1="768" y1="529" x2="1234" y2="529" stroke="#E2E8F0" stroke-width="1"/><text x="782" y="556" font-size="13" font-weight="500" fill="#162B44" text-anchor="start">生效时间</text><text x="920" y="556" font-size="13" font-weight="400" fill="#162B44" text-anchor="start">示意日期</text><text x="1112" y="556" font-size="13" font-weight="400" fill="#2458F5" text-anchor="start">待核对</text><line x1="768" y1="572" x2="1234" y2="572" stroke="#E2E8F0" stroke-width="1"/><rect x="768" y="572" width="466" height="43" rx="0" fill="#FAFBFD"/><text x="782" y="599" font-size="13" font-weight="500" fill="#162B44" text-anchor="start">业务条件</text><text x="920" y="599" font-size="13" font-weight="400" fill="#162B44" text-anchor="start">需回看原文</text><text x="1112" y="599" font-size="13" font-weight="400" fill="#2458F5" text-anchor="start">人工确认</text><line x1="768" y1="615" x2="1234" y2="615" stroke="#E2E8F0" stroke-width="1"/><rect x="768" y="617" width="466" height="55" rx="11" fill="#EFF4FF"/><text x="783" y="640" font-size="13" font-weight="600" fill="#2458F5" text-anchor="start">原文定位与规则校验共同保留</text><text x="783" y="660" font-size="11" font-weight="400" fill="#6D7A8F" text-anchor="start">异常与缺失信息进入人工复核流程</text><rect x="26" y="735" width="1228" height="43" rx="11" fill="#FFFFFF" stroke="#E2E8F0"/><circle cx="45" cy="756" r="4" fill="#E5A354"/><text x="59" y="761" font-size="14" font-weight="600" fill="#162B44" text-anchor="start">模拟效果 · 非真实产品界面/业务结果</text><text x="1229" y="761" font-size="12" font-weight="400" fill="#6D7A8F" text-anchor="end">全部人物、数值、图表和状态仅作功能说明</text></svg>