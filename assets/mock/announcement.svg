    <text x="76" y="84" font-size="16" font-weight="650" fill="#162B44" text-anchor="start">YINGMI AI</text><text x="76" y="106" font-size="11" font-weight="400" fill="#6D7A8F" text-anchor="start">专业能力 · 场景交付</text>
    <rect x="1000" y="70" width="98" height="28" rx="14" fill="#C9F27A"/><text x="1049.0" y="89" font-size="13" font-weight="500" fill="#162B44" text-anchor="middle">模拟效果</text><rect x="1110" y="70" width="116" height="28" rx="14" fill="#FFFFFF"/><text x="1168.0" y="89" font-size="13" font-weight="500" fill="#6D7A8F" text-anchor="middle">示意数据</text>
