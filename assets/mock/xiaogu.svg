    <text x="46" y="207" font-size="11" font-weight="400" fill="#6D7A8F" text-anchor="start">从明确问题出发，按专业流程组织交付</text>
    <rect x="46" y="227" width="276" height="105" rx="14" fill="#EFF4FF"/>
    <text x="62" y="253" font-size="14" font-weight="400" fill="#162B44" text-anchor="start">孩子 6 岁，想开始准备教育金。</text><text x="62" y="277" font-size="14" font-weight="400" fill="#162B44" text-anchor="start">也希望兼顾家庭备用金和养老。</text><text x="62" y="301" font-size="14" font-weight="400" fill="#162B44" text-anchor="start">先帮我把规划路径梳理清楚。</text>
    <text x="46" y="371" font-size="12" font-weight="600" fill="#6D7A8F" text-anchor="start">处理路径</text>
    <line x1="57" y1="417" x2="57" y2="447" stroke="#DCE5F8" stroke-width="2"/><circle cx="57" cy="405" r="11" fill="#EEF3FF"/><path d="M53,405 l3,3 l6,-6" fill="none" stroke="#2458F5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="77" y="409" font-size="14" font-weight="600" fill="#162B44" text-anchor="start">理解家庭与目标</text><text x="77" y="428" font-size="11" font-weight="400" fill="#6D7A8F" text-anchor="start">整理成员、收支与已有资产</text><line x1="57" y1="470" x2="57" y2="500" stroke="#DCE5F8" stroke-width="2"/><circle cx="57" cy="458" r="11" fill="#EEF3FF"/><path d="M53,458 l3,3 l6,-6" fill="none" stroke="#2458F5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="77" y="462" font-size="14" font-weight="600" fill="#162B44" text-anchor="start">识别约束条件</text><text x="77" y="481" font-size="11" font-weight="400" fill="#6D7A8F" text-anchor="start">确认期限、流动性与风险偏好</text><line x1="57" y1="523" x2="57" y2="553" stroke="#DCE5F8" stroke-width="2"/><circle cx="57" cy="511" r="11" fill="#EEF3FF"/><path d="M53,511 l3,3 l6,-6" fill="none" stroke="#2458F5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="77" y="515" font-size="14" font-weight="600" fill="#162B44" text-anchor="start">组织规划路径</text><text x="77" y="534" font-size="11" font-weight="400" fill="#6D7A8F" text-anchor="start">分层讨论目标与资金安排</text><circle cx="57" cy="564" r="11" fill="#EEF3FF"/><path d="M53,564 l3,3 l6,-6" fill="none" stroke="#2458F5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="77" y="568" font-size="14" font-weight="600" fill="#162B44" text-anchor="start">交付结构化报告</text><text x="77" y="587" font-size="11" font-weight="400" fill="#6D7A8F" text-anchor="start">呈现假设、缺口与下一步</text><rect x="46" y="644" width="276" height="48" rx="11" fill="#F8FAFD" stroke="#E2E8F0"/><text x="60" y="664" font-size="12" font-weight="400" fill="#6D7A8F" text-anchor="start">示例输入已匿名化</text><text x="60" y="682" font-size="11" font-weight="400" fill="#6D7A8F" text-anchor="start">模拟分析 · 不触发真实交易</text><rect x="366" y="148" width="888" height="72" rx="16" fill="white" stroke="#E2E8F0"/><text x="388" y="179" font-size="22" font-weight="650" fill="#162B44" text-anchor="start">从家庭需求，到可讨论的财富规划</text><text x="388" y="203" font-size="12" font-weight="400" fill="#6D7A8F" text-anchor="start">输入整理 → 现金流分析 → 目标拆解 → 规划报告</text><rect x="366" y="236" width="210" height="91" rx="14" fill="#F2F6FF" stroke="#E2E8F0"/><text x="383" y="261" font-size="12" font-weight="400" fill="#6D7A8F" text-anchor="start">目标梳理</text><text x="383" y="292" font-size="25" font-weight="650" fill="#2458F5" text-anchor="start">3 类目标</text><text x="383" y="313" font-size="11" font-weight="400" fill="#6D7A8F" text-anchor="start">教育 · 养老 · 备用金</text><rect x="592" y="236" width="210" height="91" rx="14" fill="white" stroke="#E2E8F0"/><text x="609" y="261" font-size="12" font-weight="400" fill="#6D7A8F" text-anchor="start">家庭收支</text><text x="609" y="292" font-size="25" font-weight="650" fill="#162B44" text-anchor="start">先确认</text><text x="609" y="313" font-size="11" font-weight="400" fill="#6D7A8F" text-anchor="start">完整输入后再做测算</text><rect x="818" y="236" width="210" height="91" rx="14" fill="white" stroke="#E2E8F0"/><text x="835" y="261" font-size="12" font-weight="400" fill="#6D7A8F" text-anchor="start">约束条件</text><text x="835" y="292" font-size="25" font-weight="650" fill="#162B44" text-anchor="start">风险与期限</text><text x="835" y="313" font-size="11" font-weight="400" fill="#6D7A8F" text-anchor="start">显式呈现关键假设</text><rect x="1044" y="236" width="210" height="91" rx="14" fill="white" stroke="#E2E8F0"/><text x="1061" y="261" font-size="12" font-weight="400" fill="#6D7A8F" text-anchor="start">交付方式</text><text x="1061" y="292" font-size="25" font-weight="650" fill="#162B44" text-anchor="start">规划报告</text><text x="1061" y="313" font-size="11" font-weight="400" fill="#6D7A8F" text-anchor="start">供用户核验与讨论</text><rect x="366" y="343" width="416" height="350" rx="16" fill="white" stroke="#E2E8F0"/><text x="386" y="373" font-size="17" font-weight="600" fill="#162B44" text-anchor="start">家庭资金用途结构</text><text x="386" y="395" font-size="12" font-weight="400" fill="#6D7A8F" text-anchor="start">占比为示意，不代表任何推荐配置</text><circle cx="488" cy="501" r="72" fill="none" stroke="#EEF2F8" stroke-width="24"/><circle cx="488" cy="501" r="72" fill="none" stroke="#2458F5" stroke-width="24" stroke-dasharray="109.09733552923255 343.29200658769764" stroke-dashoffset="0" transform="rotate(-90 488 501)"/><circle cx="488" cy="501" r="72" fill="none" stroke="#C9F27A" stroke-width="24" stroke-dasharray="154.3362697409256 298.0530723760046" stroke-dashoffset="-113.09733552923255" transform="rotate(-90 488 501)"/><circle cx="488" cy="501" r="72" fill="none" stroke="#92ADF8" stroke-width="24" stroke-dasharray="176.95573684677208 275.4336052701581" stroke-dashoffset="-271.4336052701581" transform="rotate(-90 488 501)"/><text x="488" y="499" font-size="25" font-weight="650" fill="#162B44" text-anchor="middle">示意</text><text x="488" y="525" font-size="12" font-weight="400" fill="#6D7A8F" text-anchor="middle">资金分层</text><circle cx="393" cy="623" r="4" fill="#92ADF8"/><text x="404" y="628" font-size="12" font-weight="400" fill="#6D7A8F" text-anchor="start">备用</text><circle cx="498" cy="623" r="4" fill="#C9F27A"/><text x="509" y="628" font-size="12" font-weight="400" fill="#6D7A8F" text-anchor="start">教育</text><circle cx="603" cy="623" r="4" fill="#2458F5"/><text x="614" y="628" font-size="12" font-weight="400" fill="#6D7A8F" text-anchor="start">养老</text><text x="600" y="438" font-size="14" font-weight="500" fill="#162B44" text-anchor="start">先保留流动性</text><text x="600" y="485" font-size="14" font-weight="500" fill="#162B44" text-anchor="start">再安排目标资金</text><text x="600" y="532" font-size="14" font-weight="500" fill="#162B44" text-anchor="start">检查长期投入能力</text><rect x="798" y="343" width="456" height="350" rx="16" fill="white" stroke="#E2E8F0"/><text x="818" y="373" font-size="17" font-weight="600" fill="#162B44" text-anchor="start">财富目标与行动路径</text><text x="818" y="395" font-size="12" font-weight="400" fill="#6D7A8F" text-anchor="start">测算前确认金额、期限、现金流与收益假设</text><rect x="818" y="413" width="416" height="43" rx="8" fill="#F4F6FB"/><text x="832" y="440" font-size="12" font-weight="600" fill="#6D7A8F" text-anchor="start">目标</text><text x="952" y="440" font-size="12" font-weight="600" fill="#6D7A8F" text-anchor="start">资金期限</text><text x="1077" y="440" font-size="12" font-weight="600" fill="#6D7A8F" text-anchor="start">下一步</text><text x="832" y="483" font-size="13" font-weight="500" fill="#162B44" text-anchor="start">备用金</text><text x="952" y="483" font-size="13" font-weight="400" fill="#162B44" text-anchor="start">短期</text><text x="1077" y="483" font-size="13" font-weight="400" fill="#2458F5" text-anchor="start">核实必要支出</text><line x1="818" y1="499" x2="1234" y2="499" stroke="#E2E8F0" stroke-width="1"/><rect x="818" y="499" width="416" height="43" rx="0" fill="#FAFBFD"/><text x="832" y="526" font-size="13" font-weight="500" fill="#162B44" text-anchor="start">教育金</text><text x="952" y="526" font-size="13" font-weight="400" fill="#162B44" text-anchor="start">中长期</text><text x="1077" y="526" font-size="13" font-weight="400" fill="#2458F5" text-anchor="start">确认目标金额</text><line x1="818" y1="542" x2="1234" y2="542" stroke="#E2E8F0" stroke-width="1"/><text x="832" y="569" font-size="13" font-weight="500" fill="#162B44" text-anchor="start">养老储备</text><text x="952" y="569" font-size="13" font-weight="400" fill="#162B44" text-anchor="start">长期</text><text x="1077" y="569" font-size="13" font-weight="400" fill="#2458F5" text-anchor="start">评估持续投入</text><line x1="818" y1="585" x2="1234" y2="585" stroke="#E2E8F0" stroke-width="1"/><rect x="818" y="608" width="416" height="63" rx="11" fill="#F4F8EC"/><text x="832" y="633" font-size="12" font-weight="600" fill="#162B44" text-anchor="start">需要继续确认</text><text x="832" y="656" font-size="12" font-weight="400" fill="#6D7A8F" text-anchor="start">补齐家庭收支与负债，才进入目标达成测算</text><rect x="26" y="735" width="1228" height="43" rx="11" fill="#FFFFFF" stroke="#E2E8F0"/><circle cx="45" cy="756" r="4" fill="#E5A354"/><text x="59" y="761" font-size="14" font-weight="600" fill="#162B44" text-anchor="start">模拟效果 · 非真实产品界面/业务结果</text><text x="1229" y="761" font-size="12" font-weight="400" fill="#6D7A8F" text-anchor="end">全部人物、数值、图表和状态仅作功能说明</text></svg>