<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800" role="img" aria-labelledby="title desc"><title id="title">且慢 AI 小顾：从家庭需求，到可讨论的财富规划（模拟效果）</title><desc id="desc">业务场景概念示意，非真实产品界面或业务结果。全部人物、金额、图表和状态均为模拟。</desc><defs><style>text{font-family:'PingFang SC','Microsoft YaHei',Arial,sans-serif}</style><linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#FAFBFE"/><stop offset="1" stop-color="#EDF2F9"/></linearGradient></defs><rect width="1280" height="800" fill="url(#bg)"/>
