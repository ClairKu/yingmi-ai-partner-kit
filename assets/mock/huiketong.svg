"#6D7A8F" text-anchor="start">模拟分析 · 不触发真实交易</text><rect x="366" y="148" width="888" height="72" rx="16" fill="white" stroke="#E2E8F0"/><text x="388" y="179" font-size="22" font-weight="650" fill="#162B44" text-anchor="start">让账户诊断，成为一次有准备的服务</text><text x="388" y="203" font-size="12" font-weight="400" fill="#6D7A8F" text-anchor="start">多轮诊断 → 配置缺口 → 备访重点 → 顾问跟进</text><rect x="366" y="236" width="888" height="100" rx="16" fill="white" stroke="#E2E8F0"/><text x="386" y="266" font-size="17" font-weight="600" fill="#162B44" text-anchor="start">备访摘要｜示意家庭 A</text><text x="386" y="288" font-size="12" font-weight="400" fill="#6D7A8F" text-anchor="start">围绕本次沟通目标组织信息，由顾问确认后使用</text><rect x="388" y="294" width="112" height="28" rx="14" fill="#EEF3FF"/><text x="444.0" y="313" font-size="13" font-weight="500" fill="#2458F5" text-anchor="middle">目标待确认</text><rect x="514" y="294" width="126" height="28" rx="14" fill="#F4F8EC"/><text x="577.0" y="313" font-size="13" font-weight="500" fill="#162B44" text-anchor="middle">流动性需核实</text><rect x="654" y="294" width="104" height="28" rx="14" fill="#F4F6FA"/><text x="706.0" y="313" font-size="13" font-weight="500" fill="#6D7A8F" text-anchor="middle">顾问复核</text><text x="1231" y="303" font-size="12" font-weight="400" fill="#6D7A8F" text-anchor="end">匿名示例</text><rect x="366" y="352" width="392" height="341" rx="16" fill="white" stroke="#E2E8F0"/><text x="386" y="382" font-size="17" font-weight="600" fill="#162B44" text-anchor="start">配置暴露示意</text><text x="386" y="404" font-size="12" font-weight="400" fill="#6D7A8F" text-anchor="start">基于模拟持仓，不对应真实客户</text><circle cx="486" cy="510" r="73" fill="none" stroke="#EEF2F8" stroke-width="24"/><circle cx="486" cy="510" r="73" fill="none" stroke="#2458F5" stroke-width="24" stroke-dasharray="156.5353845984384 302.1371428256714" stroke-dashoffset="0" transform="rotate(-90 486 510)"/><circle cx="486" cy="510" r="73" fill="none" stroke="#89A4F4" stroke-width="24" stroke-dasharray="133.60175822723292 325.