    <text x="62" y="253" font-size="14" font-weight="400" fill="#162B44" text-anchor="start">帮我准备下一次客户沟通。</text><text x="62" y="277" font-size="14" font-weight="400" fill="#162B44" text-anchor="start">根据匿名示意持仓识别配置缺口，</text><text x="62" y="301" font-size="14" font-weight="400" fill="#162B44" text-anchor="start">并整理需要由顾问确认的问题。</text>
