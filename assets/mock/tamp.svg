    <text x="62" y="253" font-size="14" font-weight="400" fill="#162B44" text-anchor="start">我们已有客户服务团队。</text><text x="62" y="277" font-size="14" font-weight="400" fill="#162B44" text-anchor="start">希望把策略、账户和投后作业串联，</text><text x="62" y="301" font-size="14" font-weight="400" fill="#162B44" text-anchor="start">让每一步有明确权限与责任人。</text>
    <text x="46" y="371" font-size="12" font-weight="600" fill="#6D7A8F" text-anchor="start">处理路径</text>
    <line x1="57" y1="417" x2="57" y2="447" stroke="#DCE5F8" stroke-width="2"/><circle cx="57" cy="405" r="11" fill="#EEF3FF"/><path d="M53,405 l3,3 l6,-6" fill="none" stroke="#2458F5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="77" y="409" font-size="14" font-weight="600" fill="#162B44" text-anchor="start">理解机构流程</text><text x="77" y="428" font-size="11" font-weight="400" fill="#6D7A8F" text-anchor="start">梳理角色、系统与服务阶段</text><line x1="57" y1="470" x2="57" y2="500" stroke="#DCE5F8" stroke-width="2"/><circle cx="57" cy="458" r="11" fill="#EEF3FF"/><path d="M53,458 l3,3 l6,-6" fill="none" stroke="#2458F5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="77" y="462" font-size="14" font-weight="600" fill="#162B44" text-anchor="start">组织策略与账户</text><text x="77" y="481" font-size="11" font-weight="400" fill="#6D7A8F" text-anchor="start">按权限管理对象与作业状态</text><line x1="57" y1="523" x2="57" y2="553" stroke="#DCE5F8" stroke-width="2"/><circle cx="57" cy="511" r="11" fill="#EEF3FF"/><path d="M53,511 l3,3 l6,-6" fill="none" stroke="#2458F5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="77" y="515" font-size="14" font-weight="600" fill="#162B44" text-anchor="start">连接前中后台</text><text x="77" y="534" font-size="11" font-weight="400" fill="#6D7A8F" text-anchor="start">对接投研、交易与服务系统</text><circle cx="57" cy="564" r="11" fill="#EEF3FF"/><path d="M53,564 l3,3 l6,-6" fill="none" stroke="#2458F5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="77" y="568" font-size="14" font-weight="600" fill="#162B44" text-anchor="start">保留确认与留痕</text><text x="77" y="587" font-size="11" font-weight="400" fill="#6D7A8F" text-anchor="start">由责任主体完成必要确认</text><rect x="46" y="644" width="276" height="48" rx="11" fill="#F8FAFD" stroke="#E2E8F0"/><text x="60" y="664" font-size="12" font-weight="400" fill="#6D7A8F" text-anchor="start">示例输入已匿名化</text><text x="60" y="682" font-size="11" font-weight="400" fi