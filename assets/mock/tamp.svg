l="#6D7A8F" text-anchor="start">账户</text><text x="580" y="437" font-size="12" font-weight="600" fill="#6D7A8F" text-anchor="start">关联策略</text><text x="780" y="437" font-size="12" font-weight="600" fill="#6D7A8F" text-anchor="start">待处理事项</text><text x="1054" y="437" font-size="12" font-weight="600" fill="#6D7A8F" text-anchor="start">作业状态</text><text x="400" y="482" font-size="13" font-weight="500" fill="#162B44" text-anchor="start">示意账户 01</text><text x="580" y="482" font-size="13" font-weight="400" fill="#162B44" text-anchor="start">示意策略 A</text><text x="780" y="482" font-size="13" font-weight="400" fill="#162B44" text-anchor="start">核实资金使用安排</text><text x="1054" y="482" font-size="13" font-weight="400" fill="#2458F5" text-anchor="start">待顾问确认</text><line x1="386" y1="500" x2="1234" y2="500" stroke="#E2E8F0" stroke-width="1"/><rect x="386" y="500" width="848" height="45" rx="0" fill="#FAFBFD"/><text x="400" y="527" font-size="13" font-weight="500" fill="#162B44" text-anchor="start">示意账户 02</text><text x="580" y="527" font-size="13" font-weight="400" fill="#162B44" text-anchor="start">示意策略 B</text><text x="780" y="527" font-size="13" font-weight="400" fill="#162B44" text-anchor="start">复核配置偏离</text><text x="1054" y="527" font-size="13" font-weight="400" fill="#2458F5" text-anchor="start">待复核</text><line x1="386" y1="545" x2="1234" y2="545" stroke="#E2E8F0" stroke-width="1"/><text x="400" y="572" font-size="13" font-weight="500" fill="#162B44" text-anchor="start">示意账户 03</text><text x="580" y="572" font-size="13" font-weight="400" fill="#162B44" text-anchor="start">示意策略 A</text><text x="780" y="572" font-size="13" font-weight="400" fill="#162B44" text-anchor="start">整理投后报告</text><text x="1054" y="572" font-size="13" font-weight="400" fill="#2458F5" text-anchor="start">草稿</text><line x1="386" y1="590" x2="1234" y2="590" stroke="#E2E8F0" stroke-width="1"/><rect x="392" y="612" width="188" height="58" rx="11" fill="#F5F8FD"/><text x="407" y="636" font-size="14" font-weight="600" fill="#162B44" text-anchor="start">方案</text><text x="407" y="656" font-size="11" font-weight="400" fill="#6D7A8F" text-anchor="start">形成规划</text><text x="589" y="648" font-size="16" font-weight="400" fill="#6D7A8F" text-anchor="start">→</text><rect x="602" y="612" width="188" height="58" rx="11" fill="#F5F8FD"/><text x="617" y="636" font-size="14" font-weight="600" fill="#162B44" text-anchor="start">复核</text><text x="617" y="656" font-size="11" font-weight="400" fill="#6D7A8F" text-anchor="start">确认适当性</text><text x="799" y="648" font-size="16" font-weight="400" fill="#6D7A8F" text-anchor="start">→</text><rect x="812" y="612" width="188" height="58" rx="11" fill="#F5F8FD"/><text x="827" y="636" font-size="14" font-weight="600" fill="#162B44" text-anchor="start">确认</text><text x="827" y="656" font-size="11" font-weight="400" fill="#6D7A8F" text-anchor="start">客户授权</text><text x="1009" y="648" font-size="16" font-weight="400" fill="#6D7A8F" text-anchor="start">→</text><rect x="1022" y="612" width="188" height="58" rx="11" fill="#F5F8FD"/><text x="1037" y="636" font-size="14" font-weight="600" fill="#162B44" text-anchor="start">执行</text><text x="1037" y="656" font-size="11" font-weight="400" fill="#6D7A8F" text-anchor="start">既有系统承接</text><rect x="26" y="735" width="1228" height="43" rx="11" fill="#FFFFFF" stroke="#E2E8F0"/><circle cx="45" cy="756" r="4" fill="#E5A354"/><text x="59" y="761" font-size="14" font-weight="600" fill="#162B44" text-anchor="start">模拟效果 · 非真实产品界面/业务结果</text><text x="1229" y="761" font-size="12" font-weight="400" fill="#6D7A8F" text-anchor="end">全部人物、数值、图表和状态仅作功能说明</text></svg>