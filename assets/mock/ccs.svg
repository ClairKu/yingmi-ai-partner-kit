    <text x="62" y="253" font-size="14" font-weight="400" fill="#162B44" text-anchor="start">检查一段模拟投顾宣传文稿。</text><text x="62" y="277" font-size="14" font-weight="400" fill="#162B44" text-anchor="start">标记潜在风险并说明修改原因，</text><text x="62" y="301" font-size="14" font-weight="400" fill="#162B44" text-anchor="start">保留规则和版本记录供复核。</text>
