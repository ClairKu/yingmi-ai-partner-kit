"#6D7A8F" text-anchor="start">模拟分析 · 不触发真实交易</text><rect x="366" y="148" width="888" height="72" rx="16" fill="white" stroke="#E2E8F0"/><text x="388" y="179" font-size="22" font-weight="650" fill="#162B44" text-anchor="start">把合规判断，前移到内容创作过程中</text><text x="388" y="203" font-size="12" font-weight="400" fill="#6D7A8F" text-anchor="start">AI 自检 → 风险解释 → 文稿修订 → 合规专家签发</text><rect x="366" y="236" width="288" height="91" rx="14" fill="#F2F6FF" stroke="#E2E8F0"/><text x="383" y="261" font-size="12" font-weight="400" fill="#6D7A8F" text-anchor="start">审查对象</text><text x="383" y="292" font-size="25" font-weight="650" fill="#2458F5" text-anchor="start">示例文稿</text><text x="383" y="313" font-size="11" font-weight="400" fill="#6D7A8F" text-anchor="start">不对应真实营销材料</text><rect x="666" y="236" width="288" height="91" rx="14" fill="white" stroke="#E2E8F0"/><text x="683" y="261" font-size="12" font-weight="400" fill="#6D7A8F" text-anchor="start">AI 角色</text><text x="683" y="292" font-size="25" font-weight="650" fill="#162B44" text-anchor="start">1.5 道防线</text><text x="683" y="313" font-size="11" font-weight="400" fill="#6D7A8F" text-anchor="start">辅助创作者提前修正</text><rect x="966" y="236" width="288" height="91" rx="14" fill="white" stroke="#E2E8F0"/><text x="983" y="261" font-size="12" font-weight="400" fill="#6D7A8F" text-anchor="start">最终签发</text><text x="983" y="292" font-size="25" font-weight="650" fill="#162B44" text-anchor="start">合规专家</text><text x="983" y="313" font-size="11" font-weight="400" fill="#6D7A8F" text-anchor="start">保留专业判断与审计</text><rect x="366" y="343" width="497" height="350" rx="16" fill="white" stroke="#E2E8F0"/><text x="386" y="373" font-size="17" font-weight="600" fill="#162B44" text-anchor="start">文稿预审示意</text><text x="386" y="395" font-size="12" font-weight="400" fill="#6D7A8F" text-anchor="start">标记风险位置，给出修改方向</text><text x="386" y="423" font-size="12" font-weight="600" fill="#6D7A8F" text-anchor="start">示例原句</text><rect x="386" y="439" width="457" height="62" rx="11" fill="#FFF5EA"/><text x="401" y="476" font-size="17" font-weight="500" fill="#AD6D28" text-anchor="start">“这项投资一定能让你安心赚钱。”</text><rect x="386" y="521" width="152" height="28" rx="14" fill="#FFF0DE"/><text x="462.0" y="540" font-size="13" font-weight="500" fill="#A56829" text-anchor="middle">收益承诺风险</text><rect x="550" y="521" width="138" height="28" rx="14" fill="#F5F6FA"/><text x="619.0" y="540" font-size="13" font-weight="500" fill="#6D7A8F" text-anchor="middle">表述需修正</text><text x="386" y="584" font-size="12" font-weight="600" fill="#6D7A8F" text-anchor="start">修改方向</text><text x="386" y="612" font-size="14" font-weight="400" fill="#162B44" text-anchor="start">删除确定性收益承诺，补充适用条件与风险。</text><text x="386" y="640" font-size="14" font-weight="400" fill="#162B44" text-anchor="start">以事实、数据与可核实的产品特征展开说明。</text><rect x="879" y="343" width="375" height="350" rx="16" fill="white" stroke="#E2E8F0"/><text x="899" y="373" font-size="17" font-weight="600" fill="#162B44" text-anchor="start">审核记录与专业复核</text><text x="899" y="395" font-size="12" font-weight="400" fill="#6D7A8F" text-anchor="start">规则与版本留痕，AI 不替代签发</text><circle cx="906" cy="426" r="11" fill="#EEF3FF"/><path d="M902,426 l3,3 l6,-6" fill="none" stroke="#2458F5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="927" y="430" font-size="15" font-weight="600" fill="#162B44" text-anchor="start">标记风险维度</text><text x="927" y="455" font-size="12" font-weight="400" fill="#6D7A8F" text-anchor="start">语义 + 上下文 + 风险提示</text><circle cx="906" cy="504" r="11" fill="#EEF3FF"/><path d="M902,504 l3,3 l6,-6" fill="none" stroke="#2458F5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="927" y="508" font-size="15" font-weight="600" fill="#162B44" text-anchor="start">建议创作者修订</text><text x="927" y="533" font-size="12" font-weight="400" fill="#6D7A8F" text-anchor="start">展示位置与修改理由</text><circle cx="906" cy="582" r="11" fill="#EEF3FF"/><path d="M902,582 l3,3 l6,-6" fill="none" stroke="#2458F5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="927" y="586" font-size="15" font-weight="600" fill="#162B44" text-anchor="start">提交合规专家</text><text x="927" y="611" font-size="12" font-weight="400" fill="#6D7A8F" text-anchor="start">保留最终判断与签发</text><rect x="26" y="735" width="1228" height="43" rx="11" fill="#FFFFFF" stroke="#E2E8F0"/><circle cx="45" cy="756" r="4" fill="#E5A354"/><text x="59" y="761" font-size="14" font-weight="600" fill="#162B44" text-anchor="start">模拟效果 · 非真实产品界面/业务结果</text><text x="1229" y="761" font-size="12" font-weight="400" fill="#6D7A8F" text-anchor="end">全部人物、数值、图表和状态仅作功能说明</text></svg>