    <line x1="57" y1="417" x2="57" y2="447" stroke="#DCE5F8" stroke-width="2"/><circle cx="57" cy="405" r="11" fill="#EEF3FF"/><path d="M53,405 l3,3 l6,-6" fill="none" stroke="#2458F5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="77" y="409" font-size="14" font-weight="600" fill="#162B44" text-anchor="start">检索素材与观点</text><text x="77" y="428" font-size="11" font-weight="400" fill="#6D7A8F" text-anchor="start">确认出处、时点与适用范围</text><line x1="57" y1="470" x2="57" y2="500" stroke="#DCE5F8" stroke-width="2"/><circle cx="57" cy="458" r="11" fill="#EEF3FF"/><path d="M53,458 l3,3 l6,-6" fill="none" stroke="#2458F5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="77" y="462" font-size="14" font-weight="600" fill="#162B44" text-anchor="start">按受众组织内容</text><text x="77" y="481" font-size="11" font-weight="400" fill="#6D7A8F" text-anchor="start">讲清事实、影响与行动条件</text><line x1="57" y1="523" x2="57" y2="553" stroke="#DCE5F8" stroke-width="2"/><circle cx="57" cy="511" r="11" fill="#EEF3FF"/><path d="M53,511 l3,3 l6,-6" fill="none" stroke="#2458F5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="77" y="515" font-size="14" font-weight="600" fill="#162B44" text-anchor="start">生成图文草稿</text><text x="77" y="534" font-size="11" font-weight="400" fill="#6D7A8F" text-anchor="start">统一内容结构与视觉表达</text><circle cx="57" cy="564" r="11" fill="#EEF3FF"/><path d="M53,564 l3,3 l6,-6" fill="none" stroke="#2458F5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="77" y="568" font-size="14" font-weight="600" fill="#162B44" text-anchor="start">进入审查与签发</text><text x="77" y="587" font-size="11" font-weight="400" fill="#6D7A8F" text-anchor="start">人工复核后再决定发布</text><rect x="46" y="644" width="276" height="48" rx="11" fill="#F8FAFD" stroke="#E2E8F0"/><text x="60" y="664" font-size="12" font-weight="400" fill="#6D7A8F" text-anchor="start">示例输入已匿名化</text><text x="60" y="682" font-size="11" font-weight="400" fill="#6D7A8F" text-anchor="start">模拟分析 · 不触发真实交易</text><rect x="366" y="148" width="888" height="72" rx="16" fill="white" stroke="#E2E8F0"/><text x="388" y="179" font-size="22" font-weight="650" fill="#162B44" text-anchor="start">从素材检索，到有依据的客户陪伴内容</text><text x="388" y="203" font-size="12" font-weight="400" fill="#6D7A8F" text-anchor="start">素材 → 取数 → 研判起草 → 图文成稿 → 合规签发</text><rect x="366" y="236" width="888" height="84" rx="16" fill="white" stroke="#E2E8F0"/><text x="386" y="266" font-size="17" font-weight="600" fill="#162B44" text-anchor="start">内容任务｜市场变化如何向长期投资者解释？</text><text x="386" y="288" font-size="12" font-weight="400" fill="#6D7A8F" text-anchor="start">示例题材与稿件仅展示流程，不代表盈米正式观点</text><rect x="1050" y="263" width="164" height="28" rx="14" fill="#F4F8EC"/><text x="1132.0" y="282" font-size="13" font-weight="500" fill="#162B44" text-anchor="middle">人机协同稿</text><rect x="366" y="336" width="290" height="357" rx="16" fill="white" stroke="#E2E8F0"/><text x="386" y="366" font-size="17" font-weight="600" fill="#162B44" text-anchor="start">素材与证据</text><text x="386" y="388" font-size="12" font-weight="400" fill="#6D7A8F" text-anchor="start">先组织来源，再展开表达</text><rect x="386" y="390" width="250" height="48" rx="9" fill="#F7F9FC"/><circle cx="400" cy="409" r="5" fill="#2458F5"/><text x="415" y="411" font-size="13" font-weight="600" fill="#162B44" text-anchor="start">市场数据</text><text x="415" y="429" font-size="11" font-weight="400" fill="#6D7A8F" text-anchor="start">时点与口径待核实</text><rect x="386" y="448" width="250" height="48" rx="9" fill="#F7F9FC"/><circle cx="400" cy="467" r="5" fill="#C9F27A"/><text x="415" y="469" font-size="13" font-weight="600" fill="#162B44" text-anchor="start">公开资讯</text><text x="415" y="487" font-size="11" font-weight="400" fill="#6D7A8F" text-anchor="start">保留原文出处</text><rect x="386" y="506" width="250" height="48" rx="9" fill="#F7F9FC"/><circle cx="400" cy="525" r="5" fill="#A7B9E8"/><text x="415" y="527" font-size="13" font-weight="600" fill="#162B44" text-anchor="start">研究观点</text><text x="415" y="545" font-size="11" font-weight="400" fill="#6D7A8F" text-anchor="start">区分事实与判断</text><rect x="386" y="564" width="250" height="48" rx="9" fill="#F7F9FC"/><circle cx="400" cy="583" r="5" fill="#2458F5"/><text x="415" y="585" font-size="13" font-weight="600" fill="#162B44" text-anchor="start">受众需求</text><text x="415" y="603" font-size="11" font-weight="400" fill="#6D7A8F" text-anchor="start">普通投资者可理解</text><rect x="672" y="336" width="582" height="357" rx="16" fill="white" stroke="#E2E8F0"/><text x="692" y="366" font-size="17" font-weight="600" fill="#162B44" text-anchor="start">结构化内容草稿</text><text x="692" y="388" font-size="12" font-weight="400" fill="#6D7A8F" text-anchor="start">可继续生成图文，并进入合规复核</text><rect x="692" y="397" width="105" height="28" rx="14" fill="#EFF3FF"/><text x="744.5" y="416" font-size="13" font-weight="500" fill="#2458F5" text-anchor="middle">市场解读</text><rect x="807" y="397" width="105" height="28" rx="14" fill="#F4F6FA"/><text x="859.5" y="416" font-size="13" font-weight="500" fill="#6D7A8F" text-anchor="middle">客户陪伴</text><text x="692" y="462" font-size="23" font-weight="650" fill="#162B44" text-anchor="start">市场出现波动，先看清自己的资金用途</text><text x="692" y="499" font-size="15" font-weight="400" fill="#162B44" text-anchor="start">① 发生了什么：核对数据与事件来源</text><text x="692" y="534" font-size="15" font-weight="400" fill="#162B44" text-anchor="start">② 与我有关吗：结合期限与账户安排解释</text><text x="692" y="569" font-size="15" font-weight="400" fill="#162B44" text-anchor="start">③ 下一步做什么：给出需要确认的事项</text><line x1="692" y1="600" x2="1234" y2="600" stroke="#E2E8F0" stroke-width="1"/><rect x="692" y="624" width="116" height="28" rx="14" fill="#F4F8EC"/><text x="750.0" y="643" font-size="13" font-weight="500" fill="#162B44" text-anchor="middle">图文成稿</text><text x="825" y="644" font-size="18" font-weight="400" fill="#6D7A8F" text-anchor="start">→</text><rect x="851" y="624" width="116" height="28" rx="14" fill="#EFF3FF"/><text x="909.0" y="643" font-size="13" font-weight="500" fill="#2458F5" text-anchor="middle">合规复核</text><text x="980" y="644" font-size="18" font-weight="400" fill="#6D7A8F" text-anchor="start">→</text><rect x="1007" y="624" width="116" height="28" rx="14" fill="#F4F6FA"/><text x="1065.0" y="643" font-size="13" font-weight="500" fill="#6D7A8F" text-anchor="middle">人工签发</text><rect x="26" y="735" width="1228" height="43" rx="11" fill="#FFFFFF" stroke="#E2E8F0"/><circle cx="45" cy="756" r="4" fill="#E5A354"/><text x="59" y="761" font-size="14" font-weight="600" fill="#162B44" text-anchor="start">模拟效果 · 非真实产品界面/业务结果</text><text x="1229" y="761" font-size="12" font-weight="400" fill="#6D7A8F" text-anchor="end">全部人物、数值、图表和状态仅作功能说明</text></svg>