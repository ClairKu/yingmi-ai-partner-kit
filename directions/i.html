function choose(){const group=roleGroups.find(g=>g.id===state.group),t=current();return `<div class="module"><div class="module-intro"><div class="eyebrow">02 / FIND YOUR SCENARIO</div><h1>你的业务，<br>想先解决<em>什么？</em></h1><p class="lead">选一个客群、一个具体任务。后面的能力、交付和合作建议，都随这次选择展开。</p><div class="context-note">18 类客群，收拢为 5 个入口。<br><strong>先找任务，再看产品。</strong></div></div><div class="workspace"><div class="ws-head"><strong>从我出发</strong><span>选择会贯穿后续所有模块</span></div><div class="groups">${roleGroups.map(g=>`<button data-group="${g.id}" class="${g.id===state.group?'selected':''}" aria-pressed="${g.id===state.group}">${g.name}<small>${g.en}</small></button>`).join('')}</div><label class="precision">具体身份<select id="audience-select">${group.ids.map(id=>{const a=D.audiences.find(x=>x.id===id);return `<option value="${id}" ${id===state.audience?'selected':''}>${esc(a.name)}</option>`}).join('')}</select></label><div class="task-label"><span>先选一件要做的事</span><span>01 — 03</span></div>${taskList().map((x,i)=>`<button data-task="${i}" class="task-row ${i===state.task?'selected':''}" aria-pressed="${i===state.task}"><span class="number">0${i+1}</span><span><strong>${esc(x[0])}</strong><small>${esc(x[1])}</small></span><span class="circle"></span></button>`).join('')}<div class="recommendation"><span>将为你展开</span><b>${esc(t[4])} →</b></div></div></div>`}
function capability(){const t=current(),p=prod(t[2][state.cap]);return `<div class="module"><div class="module-intro"><div class="eyebrow">03 / COMPOSE THE CAPABILITIES</div><h1>一个任务，<br>一组<em>专业能力。</em></h1><p class="lead">先看解决问题需要什么，再看由哪些产品承接。点选组合中的能力，查看输入与交付。</p><div class="context-note">当前任务<br><strong>${esc(t[0])}</strong><br>以下为基于公开能力的组合建议。</div></div><div class="workspace"><div class="assembly"><div class="assembly-label">你已有的入口<b>${esc(audience().name)}</b></div><div class="connector"></div><div class="cap-set"><div class="sub">为当前任务推荐的能力组合</div><div class="cap-tabs">${t[2].map((id,i)=>{const x=prod(id);return `<button class="cap-tab ${i===state.cap?'selected':''}" data-cap="${i}" aria-pressed="${i===state.cap}"><strong>${esc(short[id])}</strong><small>${esc(x.category)}</small></button>`}).join('')}</div><div class="cap-detail"><div><label>需要什么输入</label><p>${esc(p.input)}</p></div><div><label>提供什么结果</label><p>${esc(p.output)}</p></div></div></div><div class="connector"></div><div class="assembly-output"><span>↳</span><div><strong>${esc(t[4])}</strong><p>在约定的权限与服务范围内，进入你的业务流程</p></div></div></div><button class="small-action" data-library="products">展开 11 项产品与总体蓝图 ↗</button></div></div>`}
function delivery(){const c=currentCase();return `<div class="module case-module"><div class="module-intro"><div class="eyebrow">04 / SEE THE DELIVERY</div><h1>专业能力，<br>最终长成<em>这样。</em></h1><p class="lead">${esc(c.title)}</p><div class="context-note">${esc(c.workflow)}<br><strong>${esc(c.tag)}</strong></div><button class="small-action" data-library="cases">查看完整案例库 ↗</button></div><div class="case-view"><div class="case-toolbar"><span>${esc(c.kind)} · ${esc(c.product==='mcp'?'盈米 MCP':short[c.product]||c.product)}</span><button data-zoom="${c.id}">放大查看 ↗</button></div><button class="case-image" data-zoom="${c.id}" aria-label="放大查看${esc(c.title)}"><img src="${imagePath(c.image)}" alt="${esc(c.title)} · ${esc(c.kind)}"></button><div class="case-story"><div><label>业务问题</label><p>${esc(c.problem)}</p></div><div><label>实际输出形态</label><p>${esc(c.output)}</p></div></div><p class="proof">${esc(c.proof)} <a href="${esc(c.source)}" target="_blank" rel="noopener" style="color:var(--blue)">公开来源 ↗</a></p></div></div>`}
function cooperation(){const a=audience(),t=current(),m=modes[state.mode];return `<div class="module"><div class="module-intro"><div class="eyebrow">05 / START A PARTNERSHIP</div><h1>从一个场景，<br>开始<em>一次合作。</em></h1><p class="lead">你的选择已经组成一份讨论简报。选好合作深度，就可以带着具体目标进入下一次沟通。</p><div class="context-note">建议先做一个可验收的试点。<br><strong>${esc(a.next)}</strong></div><button class="small-action" data-library="business">查看合作模式与公开价格 ↗</button></div><div class="workspace"><div class="brief-top"><div class="brief-icon">↗</div><div><h2>我的合作简报</h2><small>由当前客群、任务与能力组合生成 · 方案建议</small></div></div><div class="modes" aria-label="选择合作深度">${modes.map((x,i)=>`<button data-mode="${i}" class="${i===state.mode?'selected':''}" aria-pressed="${i===state.mode}">${x.name}</button>`).join('')}</div><div class="brief-row"><label>业务任务</label><p>${esc(a.name)} · ${esc(t[0])}</p></div><div class="brief-row"><label>能力组合</label><p>${t[2].map(id=>esc(prod(id).name)).join(' ＋ ')}</p></div><div class="brief-row"><label>交付目标</label><p>${esc(t[4])}；${esc(m.delivery)}</p></div><div class="brief-row"><label>试点起点</label><p>${esc(a.pilot)}</p></div><div class="brief-row"><label>验收维度</label><p>${esc(a.acceptance)}</p></div><div class="mode-desc"><strong>${m.name} / 建议合作路径</strong><p>${esc(m.desc)}</p></div><div class="inline-actions"><button id="copy-brief">复制简报 ↗</button><span>采购范围与商务报价另行确认</span></div></div></div>`}
function render(animate=true){const focused=document.activeElement;let restore=null;if(focused?.closest('#stage')){for(const k of ['group','task','cap','mode','outcome'])if(focused.dataset[k]!==undefined)restore='[data-'+k+'="'+focused.dataset[k]+'"]';if(focused.id==='audience-select')restore='#audience-select'}$('.route').innerHTML=steps.map((s,i)=>`<li class="${i===state.step?'active':i<state.step?'done':''}"><button data-step="${i}" ${i===state.step?'aria-current="step"':''}><i>${i<state.step?'✓':'0'+(i+1)}</i><span>${s}</span></button></li>`).join('');context();const stage=$('#stage');stage.classList.remove('enter');stage.innerHTML=[hero,choose,capability,delivery,cooperation][state.step]();if(animate&&motion){void stage.offsetWidth;stage.classList.add('enter')}$('#back').disabled=state.step===0;$('#next').innerHTML=nexts[state.step]+'<span>↗</span>';$('.status').innerHTML=`<b>0${state.step+1}</b> / 05 &nbsp; ${steps[state.step]}`;syncURL();if(restore)document.querySelector(restore)?.focus({preventScroll:true});if(parent!==window)parent.postMessage({type:'yingmi-state',view:['entry','scene','capabilities','delivery','cooperation'][state.step],index:state.step},location.origin)}

function download(){const blob=new Blob([brief()],{type:'text/plain;charset=utf-8'}),u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=`盈米AI-合作简报-${audience().name}.txt`;a.click();setTimeout(()=>URL.revokeObjectURL(u),3000);toast('已生成合作简报，可继续修改选择')}let toastTimer;function toast(t){$('.toast').textContent=t;$('.toast').hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('.toast').hidden=true,3000)}
const sourceLink=(url,label='公开来源')=>url?`<a href="${esc(url)}" target="_blank" rel="noopener">${label} ↗</a>`:'';function item(title,text,extra=''){return `<article class="lib-item"><h3>${esc(title)}</h3><p>${esc(text)}</p>${extra}</article>`}
function libraryContent(){const q=$('#library-search').value.trim().toLowerCase();const filter=arr=>arr.filter(x=>!q||JSON.stringify(x).toLowerCase().includes(q));let html='';if(libTab==='company'){html=item('盈米 × 且慢 × AI',D.company.intro,D.company.brands.map(x=>`<p style="margin-top:10px"><b>${esc(x.name)}</b> · ${esc(x.desc)}</p>`).join(''));html+='<div class="lib-metrics">'+filter(D.company.metrics).map(x=>`<article class="lib-item"><h3>${esc(x.value)}</h3><p>${esc(x.label)}</p><small>${esc(x.date)}</small>${sourceLink(x.source)}</article>`).join('')+'</div>';html+=item('总体战略框架',D.strategy.intro,sourceLink(D.strategy.source));html+=filter(D.strategy.steps).map((x,i)=>item('0'+(i+1)+' / '+x.name,x.desc)).join('');if(q)html=html.includes(q)||/盈米|且慢|ai|战略/.test(q)?html:'<p class="empty">该分类中没有找到匹配内容</p>'}
if(libTab==='products'){html=`<div class="blueprint"><h3>总体产品蓝图</h3><p>专业底座 → 任务生产 → 业务服务；点选产品查看交付边界。</p>${[['01 专业底座',['mcp','skills','benchmark']],['02 任务生产',['vesta','editor','ccs','announcement']],['03 业务服务',['xiaogu','huiketong','tamp','agent']]].map((r,i)=>`<div class="blueprint-row"><label>${r[0]}</label><div class="blueprint-nodes">${r[1].map(id=>`<button data-blueprint-product="${id}">${short[id]}</button>`).join('')}</div></div>${i<2?'<div class="blueprint-arrow">↓</div>':''}`).join('')}</div>`;html+=item('产品与能力全景','从专业底座 → 场景流程 → 产品与服务。以下按任务领域展开，产品组合与接入范围须逐项确认。');html+=filter(D.domains).map(x=>item(x.name,x.desc,`<small>${esc(Array.isArray(x.examples)?x.examples.join(' / '):x.examples)}</small>`)).join('');html+=filter(D.products).map(p=>`<article class="lib-item" id="product-${p.id}"><span class="lib-tag">${esc(p.category)} · ${esc(p.status)}</span><h3>${esc(p.name)}</h3><p>${esc(p.desc)}</p><small>输入：${esc(p.input)}<br>输出：${esc(p.output)}<br>交付：${esc(p.delivery)}</small>${sourceLink(p.source)}</article>`).join('');html+=item('工具与方法目录','当前资料快照含 '+D.tools.length+' 项工具、'+D.skills.length+' 条 Skills 路线；资料口径不等于实时可订阅总量。',`<div class="lib-pills">${filter(D.tools).map(x=>`<span>${esc(x.name)}</span>`).join('')}</div><div class="lib-pills">${filter(D.skills).map(x=>`<span>${esc(x.name)}</span>`).join('')}</div>`)}

if(libTab==='ecosystem'){html=item('上架平台、合作与比较','入口接入、合作关系与金融机构历史合作按各自公开口径展示。平台分发与能力采购分别确认。');html+=filter(D.platforms).map(x=>item(x.name,x.scope,`<small>${esc(x.type)} · ${esc(x.status)}</small>${sourceLink(x.source)}`)).join('');html+=item('竞品与协作参照','比较公开定位与能力边界，不作未经测试的性能排名。');html+=filter(D.competitors).map(x=>item(x.name,x.position,`<small>能力：${esc(x.capability)}<br>关系：${esc(x.relation)}<br>差异：${esc(x.difference)}</small>${sourceLink(x.source)}`)).join('')}
if(libTab==='business'){html=item('按客群进入方案','18 类客群已有任务、交付、计费讨论、试点和验收建议。点击可切回主线，形成你的合作简报。');html+=filter(D.audiences).map(a=>`<article class="lib-item"><h3>${esc(a.name)}</h3><p>${esc(a.delivery)}</p><small>试点：${esc(a.pilot)}<br>验收：${esc(a.acceptance)}</small><a href="#" data-use-audience="${a.id}">用这个身份生成方案 ↗</a></article>`).join('');html+=item('合作模式表','以下含标准能力与建议合作方式，是否可采购及合同范围以商务确认结果为准。');html+=filter(D.models).map(x=>item(x.name,x.deliverable,`<small>适用：${esc(x.buyer)}<br>计费：${esc(x.billing)}<br>授权：${esc(x.rights)}<br>下一步：${esc(x.next)}</small>`)).join('');html+=item('公开价格表','只展示已公开可核验的按量规格。企业授权、SLA、并发、分发与定制另洽。');html+=filter(D.pricing).map(x=>item(x.name,`¥${x.price} ${x.unit} · ${x.tools}项工具`, `<small>${esc(x.trial)}<br>${esc(x.scope)}<br>核验：${esc(x.verifiedAt)}</small>${sourceLink(x.url,'查看上架规格')}`)).join('');html+=filter(D.guides).map(x=>item(x.name,x.steps.join(' → '),sourceLink(x.url,'查看指引'))).join('')}
if(libTab==='evidence'){html='<div class="lib-metrics">'+filter(D.metrics).map(x=>`<article class="lib-item"><h3>${esc(x.value)}</h3><p>${esc(x.label)}</p><small>${esc(x.scope)}<br>${esc(x.date)} · ${esc(x.note)}</small>${sourceLink(x.source)}</article>`).join('')+'</div>';html+=filter(D.milestones).map(x=>item(x.date+' / '+x.title,x.desc,sourceLink(x.source))).join('');html+=filter(D.sources).map(x=>item(x.title,'核验：'+x.date,sourceLink(x.url,'打开来源'))).join('')}
$('.library-body').innerHTML=html||'<div class="empty">该分类中没有找到匹配内容</div>';$('.library-nav').innerHTML=Object.entries(libTabs).map(([id,label])=>`<button data-lib-tab="${id}" class="${id===libTab?'selected':''}" aria-pressed="${id===libTab}">${label}</button>`).join('')}
function openLibrary(tab){if(tab)libTab=tab;lastFocus=document.activeElement;$('#library-search').value='';libraryContent();if(!$('#library').open)$('#library').showModal()}function zoom(id){const c=D.cases.find(x=>x.id===id);if(!c)return;$('#zoom-title').textContent=c.title+' · '+c.kind;$('.zoom-scroll').innerHTML=`<img src="${imagePath(c.image)}" alt="${esc(c.title)}">`;$('#zoom').showModal()}
document.addEventListener('click',async e=>{const b=e.target.closest('button,a[data-use-audience]');if(!b)return;let v;if((v=b.dataset.step)!==undefined)go(+v);if(b.id==='next'){if(state.step<4)go(state.step+1);else download()}if(b.id==='back')go(state.step-1);if(b.id==='motion')setMotion(!motion);if(b.id==='library-open')openLibrary();if(b.dataset.library)openLibrary(b.dataset.library);if(b.dataset.close){$('#'+b.dataset.close).close();if(b.dataset.close==='library'&&lastFocus?.isConnected)lastFocus.focus()}if((v=b.dataset.outcome)!==undefined){state.outcome=+v;state.task=state.outcome;state.cap=0;render(false)}if(b.dataset.group){state.group=b.dataset.group;state.audience=roleGroups.find(x=>x.id===state.group).default;state.cap=0;render(false)}if((v=b.dataset.task)!==undefined){state.task=+v;state.cap=0;render(false)}if((v=b.dataset.cap)!==undefined){state.cap=+v;render(false)}if((v=b.dataset.mode)!==undefined){state.mode=+v;render(false)}if(b.dataset.zoom)zoom(b.dataset.zoom);if(b.dataset.blueprintProduct){const target=$('#product-'+b.dataset.blueprintProduct),body=$('.library-body');if(target)body.scrollTo({top:target.offsetTop-body.offsetTop,behavior:motion?'smooth':'auto'})}if(b.dataset.libTab){libTab=b.dataset.libTab;$('#library-search').value='';libraryContent();$('.library-body').scrollTop=0}if(b.dataset.useAudience){e.preventDefault();state.audience=b.dataset.useAudience;state.group=roleGroups.find(x=>x.ids.includes(state.audience)).id;state.cap=0;$('#library').close();go(1)}if(b.id==='copy-brief'){try{await navigator.clipboard.writeText(brief());toast('合作简报已复制')}catch{download()}}});document.addEventListener('change',e=>{if(e.target.id==='audience-select'){state.audience=e.target.value;render(false)}});$('#library-search').addEventListener('input',libraryContent);document.addEventListener('keydown',e=>{if(e.target.closest('input,select,textarea,button,a')||document.querySelector('dialog[open]')||e.altKey||e.metaKey||e.ctrlKey)return;if(e.key==='ArrowRight'){e.preventDefault();go(state.step+1)}if(e.key==='ArrowLeft'){e.preventDefault();go(state.step-1)}});document.querySelectorAll('dialog').forEach(d=>d.addEventListener('click',e=>{if(e.target===d){const r=d.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)d.close()}}));addEventListener('message',e=>{if(e.origin!==location.origin)return;const d=e.data;if(!d||typeof d!=='object')return;if(d.type==='yingmi-step'&&Number.isInteger(d.index)&&d.index>=0&&d.index<=4)go(d.index);if(d.type==='yingmi-motion'){const enabled=typeof d.value==='boolean'?d.value:d.enabled;if(typeof enabled==='boolean')setMotion(enabled)};if(d.type==='yingmi-view'){const map={entry:0,scene:1,capabilities:2,delivery:3,cooperation:4};if(Object.hasOwn(map,d.value))go(map[d.value])}});setMotion(motion);render(false);
</script></body></html>
